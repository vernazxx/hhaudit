# Install both stages with a plain `pre-commit install`
default_install_hook_types: [pre-commit, commit-msg]

repos:
# Same pinned rules and opengrep version as CI; needs opengrep on PATH (see README)
- repo: local
  hooks:
    - id: opengrep
      name: opengrep (make sast)
      entry: make sast
      language: system
      pass_filenames: false
- repo: https://github.com/Yelp/detect-secrets
  rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # frozen: v1.5.0
  hooks:
    - id: detect-secrets
      # The baseline excludes frozen `rev:` lines (public git SHAs, not secrets)
      args: ['--baseline', '.secrets.baseline']
- repo: https://github.com/golangci/golangci-lint
  rev: 25c5369a93aacb8cccea0d46e1569ca4a194564d  # frozen: v2.15.0
  hooks:
    - id: golangci-lint-full
      args: ['-E', 'gosec']
- repo: https://github.com/commitizen-tools/commitizen
  rev: f690817de25831a37094ca35af5ada05c909ff1c  # frozen: v4.19.3
  hooks:
    - id: commitizen
